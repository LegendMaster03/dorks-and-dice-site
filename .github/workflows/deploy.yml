name: Deploy dorks-and-dice-site
run-name: Deploy ${{ github.ref_name }} at ${{ github.sha }}

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: dorks-and-dice-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, dorks-and-dice-site]
    steps:
      - uses: actions/checkout@v4

      - name: Start disposable PostgreSQL
        run: |
          docker rm -f dorks-and-dice-content-test-postgres 2>/dev/null || true
          docker network create dorks-and-dice-content-test 2>/dev/null || true
          docker run -d --name dorks-and-dice-content-test-postgres \
            --network dorks-and-dice-content-test \
            -e POSTGRES_DB=content_test \
            -e POSTGRES_USER=content_test \
            -e POSTGRES_PASSWORD=content_test \
            postgres:17

          ready=false
          for i in {1..30}; do
            if docker exec dorks-and-dice-content-test-postgres \
              createdb -U content_test -O content_test identity_test; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            docker logs dorks-and-dice-content-test-postgres
            exit 1
          fi

      - name: Run tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network dorks-and-dice-content-test \
            -e HOME=/tmp \
            -e DOTNET_CLI_HOME=/tmp/dotnet \
            -e NUGET_PACKAGES=/tmp/nuget \
            -e CONTENT_TEST_POSTGRES='Host=dorks-and-dice-content-test-postgres;Port=5432;Database=content_test;Username=content_test;Password=content_test' \
            -e IDENTITY_TEST_POSTGRES='Host=dorks-and-dice-content-test-postgres;Port=5432;Database=identity_test;Username=content_test;Password=content_test' \
            -v "$PWD:/src" \
            -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            dotnet test dorks-and-dice-site.slnx --configuration Release

      - name: Cleanup disposable PostgreSQL
        if: always()
        run: |
          docker rm -f dorks-and-dice-content-test-postgres 2>/dev/null || true
          docker network rm dorks-and-dice-content-test 2>/dev/null || true

      - name: Build image
        run: docker build -t dorks-and-dice-site:latest -f dorks-and-dice-site/Dockerfile dorks-and-dice-site

      - name: Verify local content database is not deployed
        run: |
          docker run --rm --entrypoint /bin/sh dorks-and-dice-site:latest \
            -c 'test ! -e /app/Content/content.db'

      - name: Smoke test container health endpoint
        run: |
          docker rm -f dorks-and-dice-site-smoketest 2>/dev/null || true
          docker network create dorks-and-dice-smoketest 2>/dev/null || true

          docker run -d --name dorks-and-dice-site-smoketest \
            --network dorks-and-dice-smoketest \
            -e ASPNETCORE_ENVIRONMENT=Development \
            dorks-and-dice-site:latest

          for i in {1..20}; do
            body=$(docker run --rm \
              --network dorks-and-dice-smoketest \
              curlimages/curl:latest \
              -fsS http://dorks-and-dice-site-smoketest:8080/health || true)
            if [ "$body" = "OK" ]; then
              echo "Smoke test passed."
              exit 0
            fi
            sleep 1
          done

          echo "Smoke test failed. Container logs:"
          docker logs dorks-and-dice-site-smoketest || true
          exit 1

      - name: Cleanup smoke test container
        if: always()
        run: |
          docker rm -f dorks-and-dice-site-smoketest 2>/dev/null || true
          docker network rm dorks-and-dice-smoketest 2>/dev/null || true

      - name: Deploy
        run: |
          cd /mnt/HDDs/www/dorks-and-dice-site
          docker compose up -d --force-recreate
