name: Deploy dorks-and-dice-site
run-name: Deploy ${{ github.ref_name }} at ${{ github.sha }}

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: dorks-and-dice-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, dorks-and-dice-site]
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e DOTNET_CLI_HOME=/tmp/dotnet \
            -e NUGET_PACKAGES=/tmp/nuget \
            -v "$PWD:/src" \
            -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            dotnet test dorks-and-dice-site.slnx --configuration Release

      - name: Build image
        run: docker build -t dorks-and-dice-site:latest -f dorks-and-dice-site/Dockerfile dorks-and-dice-site

      - name: Verify local content database is not deployed
        run: |
          docker run --rm --entrypoint /bin/sh dorks-and-dice-site:latest \
            -c 'test ! -e /app/Content/content.db'

      - name: Smoke test container health endpoint
        run: |
          docker rm -f dorks-and-dice-site-smoketest 2>/dev/null || true
          docker run -d --name dorks-and-dice-site-smoketest \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -p 18080:8080 \
            dorks-and-dice-site:latest

          for i in {1..20}; do
            body=$(curl -fsS http://127.0.0.1:18080/health || true)
            if [ "$body" = "OK" ]; then
              echo "Smoke test passed."
              exit 0
            fi
            sleep 1
          done

          echo "Smoke test failed. Container logs:"
          docker logs dorks-and-dice-site-smoketest || true
          exit 1

      - name: Cleanup smoke test container
        if: always()
        run: docker rm -f dorks-and-dice-site-smoketest 2>/dev/null || true

      - name: Deploy
        run: |
          cd /mnt/HDDs/www/dorks-and-dice-site
          docker compose up -d --force-recreate
