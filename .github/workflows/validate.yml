name: Validate dorks-and-dice-site

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "agent/**" ]

permissions:
  contents: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, dorks-and-dice-site]
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e DOTNET_CLI_HOME=/tmp \
            -e NUGET_PACKAGES=/tmp/.nuget/packages \
            -v "$PWD:/src" \
            -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            dotnet test dorks-and-dice-site.slnx --configuration Release

      - name: Upload migrated content database
        uses: actions/upload-artifact@v4
        with:
          name: content-database
          path: dorks-and-dice-site/Content/content.db
          if-no-files-found: error

      - name: Commit migrated content database
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/article-content-overhaul'
        run: |
          if [ "${{ github.event.head_commit.message }}" = "Add migrated content database" ]; then
            exit 0
          fi

          git add dorks-and-dice-site/Content/content.db
          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add migrated content database"
          git push origin HEAD:agent/article-content-overhaul
